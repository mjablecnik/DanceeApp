openapi: 3.0.0
info:
  title: Dancee API - Complete Documentation
  version: 1.0.0
  description: |
    Complete API documentation for all Dancee backend services.

    - **Workflow API** (`dancee_workflow`): Facebook event processing pipeline — scraping, AI parsing, translation, geocoding, batch processing
    - **CMS API** (`dancee_cms`): Directus headless CMS — event data storage, admin interface

servers:
  - url: http://localhost:8080
    description: Workflow service (development, Restate ingress)
  - url: https://dancee-workflow.fly.dev
    description: Workflow service (production)
  - url: http://localhost:8055
    description: CMS service (development)
  - url: https://dancee-cms.fly.dev
    description: CMS service (production)

tags:
  - name: Workflow - Events
    description: Single-event and batch event processing (dancee_workflow)
  - name: Workflow - Listing
    description: Querying stored events and courses (dancee_workflow)
  - name: Workflow - Favorites
    description: User favorites management (dancee_workflow)
  - name: Workflow - Dance Styles
    description: Dance style catalogue lookup (dancee_workflow)
  - name: CMS - Events
    description: Event CRUD via Directus REST API (dancee_cms)
  - name: CMS - Venues
    description: Venue CRUD via Directus REST API (dancee_cms)
  - name: CMS - Groups
    description: Facebook group sources (dancee_cms)
  - name: CMS - Health
    description: CMS health check (dancee_cms)
  - name: CMS - Courses
    description: Course CRUD via Directus REST API (dancee_cms)
  - name: CMS - Courses Translations
    description: Course translation CRUD via Directus REST API (dancee_cms)
  - name: CMS - Dance Styles
    description: Dance style catalogue via Directus REST API (dancee_cms)
  - name: CMS - Dance Styles Translations
    description: Dance style translation CRUD via Directus REST API (dancee_cms)
  - name: CMS - Favorites
    description: User-saved events and courses via Directus REST API (dancee_cms)
  - name: CMS - Errors
    description: Processing error log (dancee_cms)
  - name: CMS - Skipped Events
    description: Skipped event log (dancee_cms)
  - name: CMS - User Profiles
    description: Directus user profile management (dancee_cms)
  - name: CMS - Legal Pages
    description: Terms of Use and Privacy Policy content (dancee_cms)
  - name: CMS - Contact Messages
    description: User-submitted contact/feedback messages (dancee_cms)
  - name: CMS - Firebase Auth
    description: Custom firebase-extension endpoints for Firebase-backed authentication (dancee_cms)

# =============================================================================
# WORKFLOW API (dancee_workflow — port 8080 via Restate ingress)
# =============================================================================

paths:
  /api/event:
    post:
      tags:
        - Workflow - Events
      summary: Process a single Facebook event
      description: |
        Submits a Facebook event URL for AI-powered processing.

        The workflow:
        1. Scrapes the event
        2. Checks for duplicates
        3. Classifies event type:
           - party, workshop, festival, holiday → stored in the events collection
           - course, lesson → extracted with the course extraction prompt and stored in the courses collection
           - other → skipped and recorded in skipped_events
        4. For events: extracts structured parts and info (including dresscode) via LLM
        5. Resolves venue via Nominatim geocoding
        6. Translates content to CS, EN, ES
        7. Validates dance style codes against the dance_styles collection
        8. Processes cover image (download from Facebook → reuse expired AI image → generate via AI)
        9. Stores in Directus CMS with image, image_source, and event_type fields

        The workflow key is deterministic (derived from the normalised URL), so
        repeated calls with the same URL return the existing result.
      operationId: processEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessEventRequest'
            example:
              url: "https://www.facebook.com/events/1234567890"
      responses:
        '200':
          description: Event processed (or skipped if unsupported type / duplicate)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DirectusEvent'
                  - $ref: '#/components/schemas/AlreadyProcessingResponse'
                  - type: 'null'
        '400':
          description: Missing or invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowErrorResponse'

  /api/event/reprocess:
    post:
      tags:
        - Workflow - Events
      summary: Reprocess parts of an existing event
      description: |
        Re-runs selected processing steps on an existing event in Directus.

        Available steps:
        - `parts` — re-extract event parts and title via LLM
        - `info` — re-extract event info (prices, URLs) via LLM
        - `translations` — re-translate to CS, EN, ES (or a single language via `lang`)
        - `dances` — recompute dances array from current parts

        Note: `parts` automatically triggers `dances` recomputation.
        Either `id` or `translationId` must be provided.
      operationId: reprocessEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReprocessEventRequest'
            examples:
              allSteps:
                summary: Reprocess everything
                value:
                  id: 42
              translationsOnly:
                summary: Only redo translations
                value:
                  id: 42
                  steps: ["translations"]
              singleLanguage:
                summary: Retranslate to English only
                value:
                  id: 42
                  steps: ["translations"]
                  lang: "en"
              fromTranslation:
                summary: Reprocess via translation record ID
                value:
                  translationId: 15
                  steps: ["translations"]
              partsAndDances:
                summary: Re-extract parts and recompute dances
                value:
                  id: 42
                  steps: ["parts", "dances"]
      responses:
        '200':
          description: Event reprocessed and updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectusEvent'
        '400':
          description: Missing ID or invalid steps
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowErrorResponse'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowErrorResponse'

  /api/event/force-reprocess:
    post:
      tags:
        - Workflow - Events
      summary: Force-reprocess an event by re-scraping it from Facebook
      description: |
        Re-scrapes an existing event's original Facebook URL and re-runs the full
        processing pipeline (parsing, translation, dances) on the fresh data,
        overwriting the stored event.
      operationId: forceReprocessEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  oneOf:
                    - type: string
                    - type: integer
                  description: Directus event ID
              example:
                id: 42
      responses:
        '200':
          description: Event re-scraped, reprocessed, and updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectusEvent'
        '400':
          description: Missing 'id', invalid 'id', or event has no original_url
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowErrorResponse'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowErrorResponse'
        '422':
          description: Facebook re-scrape returned an invalid start timestamp
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowErrorResponse'

  /api/event/retranslate:
    post:
      tags:
        - Workflow - Events
      summary: Trigger retranslation of a modified event or course
      description: |
        Asynchronously retranslates a modified event or course to the other two languages.

        Called by the Flutter app after successfully PATCHing an event or course in Directus.
        The handler fetches the current content for the source language from Directus (already
        updated by the PATCH), then translates it to the remaining two languages, and PATCHes
        the translations back to Directus.

        This endpoint is fire-and-forget from the app perspective — the app shows success as
        soon as the original PATCH to Directus succeeds. Translation retries are handled by
        Restate's built-in exponential backoff. On terminal failure, `translation_status` is
        set to `"partial"` and the original edit is never reverted.
      operationId: retranslateItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetranslateItemRequest'
            examples:
              event:
                summary: Retranslate a modified event
                value:
                  itemId: 42
                  itemType: "event"
                  sourceLang: "cs"
                  modifiedTextFields:
                    title: "Nový název"
                    description: "Nový popis"
              course:
                summary: Retranslate a modified course
                value:
                  itemId: 7
                  itemType: "course"
                  sourceLang: "en"
                  modifiedTextFields:
                    title: "Updated course title"
      responses:
        '200':
          description: Retranslation accepted and started
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Invalid request body (missing or wrong fields)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowErrorResponse'
        '404':
          description: Event or course not found in Directus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowErrorResponse'

  /api/events/process:
    get:
      tags:
        - Workflow - Events
      summary: Trigger batch processing of all groups
      description: |
        Kicks off batch processing for all groups stored in Directus (ordered by `updated_at`).
        Returns immediately with an acknowledgement; processing continues asynchronously via Restate.
      operationId: processBatch
      responses:
        '200':
          description: Batch processing acknowledged and started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchAcknowledgement'
              example:
                acknowledged: true
                message: "Batch processing started"

  /api/events/process-group:
    post:
      tags:
        - Workflow - Events
      summary: Trigger processing of a single Facebook group
      description: |
        Kicks off asynchronous processing for a single Facebook group URL.
        Returns immediately with an acknowledgement.
      operationId: processGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessGroupRequest'
            example:
              url: "https://www.facebook.com/PragueSalsaClub/events"
      responses:
        '200':
          description: Group processing acknowledged and started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchAcknowledgement'
        '400':
          description: Missing or invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowErrorResponse'

  /api/events/list:
    get:
      tags:
        - Workflow - Listing
      summary: List published events
      description: |
        Returns all published events from Directus with expanded translations and venue.

        Use request headers to control the response:
        - `x-dancee-filter`: JSON-encoded Directus filter (allowed fields: dances, start_time, end_time, venue, organizer, translation_status)
        - `x-dancee-lang`: Language code (cs, en, es) — flattens the matching translation onto each event
        - `x-dancee-include: original_description` — includes the original Facebook description
      operationId: listEvents
      parameters:
        - name: x-dancee-filter
          in: header
          required: false
          description: |
            JSON-encoded Directus filter. Allowed fields: dances, start_time, end_time, venue, organizer, translation_status.
          schema:
            type: string
          example: '{"dances":{"_contains":"Salsa"}}'
        - name: x-dancee-lang
          in: header
          required: false
          description: Language code. Flattens matching translation onto each event and removes the translations array.
          schema:
            type: string
            enum: [cs, en, es]
          example: cs
        - name: x-dancee-include
          in: header
          required: false
          description: Set to `original_description` to include the original Facebook description.
          schema:
            type: string
            enum: [original_description]
      responses:
        '200':
          description: List of published events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DirectusEvent'

  /api/courses/list:
    post:
      tags:
        - Workflow - Listing
      summary: List published courses
      description: |
        Returns published courses from Directus with expanded translations and venue.

        Use request headers to control the response:
        - `x-dancee-filter`: JSON-encoded Directus filter (allowed fields: dances, start_date, end_date, venue, level, translation_status)
        - `x-dancee-lang`: Language code (cs, en, es) — flattens the matching translation onto each course
      operationId: listCourses
      parameters:
        - name: x-dancee-filter
          in: header
          required: false
          description: "JSON-encoded Directus filter. Allowed fields: dances, start_date, end_date, venue, level, translation_status."
          schema:
            type: string
          example: '{"dances":{"_contains":"salsa"}}'
        - name: x-dancee-lang
          in: header
          required: false
          description: Language code. Flattens matching translation onto each course and removes the translations array.
          schema:
            type: string
            enum: [cs, en, es]
          example: cs
      responses:
        '200':
          description: List of published courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DirectusCourse'

  /api/favorites:
    post:
      tags:
        - Workflow - Favorites
      summary: Create a favorite
      description: |
        Saves an event or course as a favorite for a user.
        Validates that the referenced event or course exists before creating the favorite.
        The combination of (user_id, item_type, item_id) must be unique.
      operationId: createFavorite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectusFavorite'
            example:
              user_id: "user-123"
              item_type: "event"
              item_id: 42
      responses:
        '200':
          description: Created favorite
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectusFavorite'
        '400':
          description: Duplicate favorite, missing fields, or invalid item reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowErrorResponse'

  /api/favorites/delete:
    post:
      tags:
        - Workflow - Favorites
      summary: Delete a favorite
      description: Removes a saved favorite by user_id, item_type, and item_id.
      operationId: deleteFavorite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
                - item_type
                - item_id
              properties:
                user_id:
                  type: string
                  example: "user-123"
                item_type:
                  type: string
                  enum: [event, course]
                  example: "event"
                item_id:
                  type: integer
                  example: 42
      responses:
        '200':
          description: Favorite deleted successfully
        '404':
          description: Favorite not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowErrorResponse'

  /api/favorites/list:
    post:
      tags:
        - Workflow - Favorites
      summary: List favorites for a user
      description: Returns all saved items (events and courses) for the specified user.
      operationId: listFavorites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
              properties:
                user_id:
                  type: string
                  example: "user-123"
      responses:
        '200':
          description: List of favorites for the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DirectusFavorite'
        '400':
          description: Missing user_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowErrorResponse'

  /api/dance-styles/list:
    get:
      tags:
        - Workflow - Dance Styles
      summary: List all dance styles
      description: |
        Returns the full dance styles catalogue from Directus, ordered by `sort_order`.

        Each entry includes a `parent_code` field that links child styles to their parent.
        Styles with `parent_code: null` are top-level (parent) styles.
        Styles with a non-null `parent_code` are sub-styles of that parent.
      operationId: listDanceStyles
      responses:
        '200':
          description: List of all dance styles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DirectusDanceStyle'
              example:
                - code: "salsa"
                  name: "Salsa"
                  parent_code: null
                  sort_order: 1
                - code: "salsa-on1"
                  name: "Salsa On1"
                  parent_code: "salsa"
                  sort_order: 2
                - code: "bachata"
                  name: "Bachata"
                  parent_code: null
                  sort_order: 10

# =============================================================================
# CMS API (dancee_cms — Directus on port 8055)
# =============================================================================

  /server/health:
    get:
      tags:
        - CMS - Health
      summary: CMS health check
      description: Returns the health status of the Directus CMS instance.
      operationId: cmsHealthCheck
      responses:
        '200':
          description: CMS is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
                    example: ok

  /items/events:
    get:
      tags:
        - CMS - Events
      summary: List events
      description: |
        Retrieve events from Directus. Supports standard Directus query parameters:
        `filter`, `sort`, `limit`, `offset`, `fields`.
      operationId: cmsListEvents
      parameters:
        - $ref: '#/components/parameters/DirectusFilter'
        - $ref: '#/components/parameters/DirectusFields'
        - $ref: '#/components/parameters/DirectusLimit'
        - $ref: '#/components/parameters/DirectusOffset'
        - $ref: '#/components/parameters/DirectusSort'
      responses:
        '200':
          description: List of events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectusListResponse'
    post:
      tags:
        - CMS - Events
      summary: Create event
      operationId: cmsCreateEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectusEvent'
      responses:
        '200':
          description: Created event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectusSingleResponse'

  /items/events/{id}:
    get:
      tags:
        - CMS - Events
      summary: Get event by ID
      operationId: cmsGetEvent
      parameters:
        - $ref: '#/components/parameters/DirectusId'
        - $ref: '#/components/parameters/DirectusFields'
      responses:
        '200':
          description: Event record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectusSingleResponse'
        '404':
          description: Not found
    patch:
      tags:
        - CMS - Events
      summary: Update event
      operationId: cmsUpdateEvent
      parameters:
        - $ref: '#/components/parameters/DirectusId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectusEvent'
      responses:
        '200':
          description: Updated event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectusSingleResponse'
    delete:
      tags:
        - CMS - Events
      summary: Delete event
      operationId: cmsDeleteEvent
      parameters:
        - $ref: '#/components/parameters/DirectusId'
      responses:
        '204':
          description: Deleted

  /items/venues:
    get:
      tags:
        - CMS - Venues
      summary: List venues
      operationId: cmsListVenues
      parameters:
        - $ref: '#/components/parameters/DirectusFilter'
        - $ref: '#/components/parameters/DirectusFields'
        - $ref: '#/components/parameters/DirectusLimit'
      responses:
        '200':
          description: List of venues
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectusListResponse'
    post:
      tags:
        - CMS - Venues
      summary: Create venue
      operationId: cmsCreateVenue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectusVenue'
      responses:
        '200':
          description: Created venue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectusSingleResponse'

  /items/venues/{id}:
    patch:
      tags:
        - CMS - Venues
      summary: Update venue
      operationId: cmsUpdateVenue
      parameters:
        - $ref: '#/components/parameters/DirectusId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectusVenue'
      responses:
        '200':
          description: Updated venue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectusSingleResponse'

  /items/groups:
    get:
      tags:
        - CMS - Groups
      summary: List groups
      description: Facebook page/group URLs used as event sources. Managed via Directus admin UI.
      operationId: cmsListGroups
      parameters:
        - $ref: '#/components/parameters/DirectusFilter'
        - $ref: '#/components/parameters/DirectusSort'
      responses:
        '200':
          description: List of groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectusListResponse'

  /items/groups/{id}:
    patch:
      tags:
        - CMS - Groups
      summary: Update group (e.g. updated_at timestamp)
      operationId: cmsUpdateGroup
      parameters:
        - $ref: '#/components/parameters/DirectusId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectusGroup'
      responses:
        '200':
          description: Updated group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectusSingleResponse'

  /items/courses:
    get:
      tags:
        - CMS - Courses
      summary: List courses
      description: Supports standard Directus query parameters — `filter`, `sort`, `limit`, `offset`, `fields`.
      operationId: cmsListCourses
      parameters:
        - $ref: '#/components/parameters/DirectusFilter'
        - $ref: '#/components/parameters/DirectusFields'
        - $ref: '#/components/parameters/DirectusLimit'
        - $ref: '#/components/parameters/DirectusOffset'
        - $ref: '#/components/parameters/DirectusSort'
      responses:
        '200':
          description: List of courses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectusListResponse'
    post:
      tags:
        - CMS - Courses
      summary: Create course
      operationId: cmsCreateCourse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectusCourse'
      responses:
        '200':
          description: Created course
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectusSingleResponse'

  /items/courses/{id}:
    get:
      tags:
        - CMS - Courses
      summary: Get course by ID
      operationId: cmsGetCourse
      parameters:
        - $ref: '#/components/parameters/DirectusId'
        - $ref: '#/components/parameters/DirectusFields'
      responses:
        '200':
          description: Course record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectusSingleResponse'
        '404':
          description: Not found
    patch:
      tags:
        - CMS - Courses
      summary: Update course
      operationId: cmsUpdateCourse
      parameters:
        - $ref: '#/components/parameters/DirectusId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectusCourse'
      responses:
        '200':
          description: Updated course
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectusSingleResponse'
    delete:
      tags:
        - CMS - Courses
      summary: Delete course
      operationId: cmsDeleteCourse
      parameters:
        - $ref: '#/components/parameters/DirectusId'
      responses:
        '204':
          description: Deleted

  /items/courses_translations:
    get:
      tags:
        - CMS - Courses Translations
      summary: List course translations
      operationId: cmsListCourseTranslations
      parameters:
        - $ref: '#/components/parameters/DirectusFilter'
        - $ref: '#/components/parameters/DirectusFields'
        - $ref: '#/components/parameters/DirectusLimit'
      responses:
        '200':
          description: List of course translations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectusListResponse'
    post:
      tags:
        - CMS - Courses Translations
      summary: Create course translation
      operationId: cmsCreateCourseTranslation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectusCourseTranslation'
      responses:
        '200':
          description: Created translation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectusSingleResponse'

  /items/courses_translations/{id}:
    patch:
      tags:
        - CMS - Courses Translations
      summary: Update course translation
      operationId: cmsUpdateCourseTranslation
      parameters:
        - $ref: '#/components/parameters/DirectusId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectusCourseTranslation'
      responses:
        '200':
          description: Updated translation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectusSingleResponse'

  /items/dance_styles:
    get:
      tags:
        - CMS - Dance Styles
      summary: List dance styles
      description: Returns the hierarchical catalogue of dance styles used for event/course tagging and filtering.
      operationId: cmsListDanceStyles
      parameters:
        - $ref: '#/components/parameters/DirectusFilter'
        - $ref: '#/components/parameters/DirectusFields'
        - $ref: '#/components/parameters/DirectusSort'
        - $ref: '#/components/parameters/DirectusLimit'
      responses:
        '200':
          description: List of dance styles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectusListResponse'

  /items/dance_styles/{code}:
    get:
      tags:
        - CMS - Dance Styles
      summary: Get dance style by code
      operationId: cmsGetDanceStyle
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          example: "salsa"
        - $ref: '#/components/parameters/DirectusFields'
      responses:
        '200':
          description: Dance style record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectusSingleResponse'
        '404':
          description: Not found

  /items/dance_styles_translations:
    get:
      tags:
        - CMS - Dance Styles Translations
      summary: List dance style translations
      operationId: cmsListDanceStyleTranslations
      parameters:
        - $ref: '#/components/parameters/DirectusFilter'
        - $ref: '#/components/parameters/DirectusFields'
        - $ref: '#/components/parameters/DirectusLimit'
      responses:
        '200':
          description: List of dance style translations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectusListResponse'

  /items/favorites:
    get:
      tags:
        - CMS - Favorites
      summary: List favorites
      description: Filter by `user_id` to retrieve a specific user's saved items.
      operationId: cmsListFavorites
      parameters:
        - $ref: '#/components/parameters/DirectusFilter'
        - $ref: '#/components/parameters/DirectusFields'
        - $ref: '#/components/parameters/DirectusLimit'
        - $ref: '#/components/parameters/DirectusSort'
      responses:
        '200':
          description: List of favorites
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectusListResponse'
    post:
      tags:
        - CMS - Favorites
      summary: Create favorite
      description: |
        Saves an event or course as a favorite for a user.
        The combination of (user_id, item_type, item_id) must be unique — duplicates return 400.
      operationId: cmsCreateFavorite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectusFavorite'
            example:
              user_id: "user-123"
              item_type: "event"
              item_id: 42
      responses:
        '200':
          description: Created favorite
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectusSingleResponse'
        '400':
          description: Duplicate favorite or invalid item reference

  /items/favorites/{id}:
    delete:
      tags:
        - CMS - Favorites
      summary: Delete favorite
      operationId: cmsDeleteFavorite
      parameters:
        - $ref: '#/components/parameters/DirectusId'
      responses:
        '204':
          description: Deleted

  /items/errors:
    get:
      tags:
        - CMS - Errors
      summary: List processing errors
      operationId: cmsListErrors
      parameters:
        - $ref: '#/components/parameters/DirectusFilter'
        - $ref: '#/components/parameters/DirectusSort'
        - $ref: '#/components/parameters/DirectusLimit'
      responses:
        '200':
          description: List of errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DirectusError'

  /items/skipped_events:
    get:
      tags:
        - CMS - Skipped Events
      summary: List skipped events
      operationId: cmsListSkippedEvents
      parameters:
        - $ref: '#/components/parameters/DirectusFilter'
        - $ref: '#/components/parameters/DirectusSort'
        - $ref: '#/components/parameters/DirectusLimit'
      responses:
        '200':
          description: List of skipped events
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DirectusSkippedEvent'

  /users:
    get:
      tags:
        - CMS - User Profiles
      summary: List users (filter by firebase_uid)
      description: |
        Retrieve Directus user records. Filter by `firebase_uid` to look up the current user's profile.
        Example filter: `{"firebase_uid":{"_eq":"<uid>"}}`.
      operationId: cmsListUsers
      parameters:
        - $ref: '#/components/parameters/DirectusFilter'
        - $ref: '#/components/parameters/DirectusFields'
        - $ref: '#/components/parameters/DirectusLimit'
      responses:
        '200':
          description: List of user records
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DirectusUserProfile'

  /users/{id}:
    patch:
      tags:
        - CMS - User Profiles
      summary: Update user profile
      description: |
        Partially update the Directus user record identified by `id` (UUID).
        Supports updating custom profile fields: `first_name`, `last_name`, `phone`, `city`, `bio`,
        `dance_tags`, and `experience_level`.
      operationId: cmsUpdateUserProfile
      parameters:
        - name: id
          in: path
          required: true
          description: Directus user UUID
          schema:
            type: string
            format: uuid
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectusUserProfileUpdate'
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DirectusUserProfile'
        '403':
          description: Forbidden — token does not have permission to update this user
        '404':
          description: User not found

  /items/legal_pages:
    get:
      tags:
        - CMS - Legal Pages
      summary: Get legal page content
      description: |
        Fetch a legal page (Terms of Use or Privacy Policy) by slug with translated content.
        Use filter `{"slug":{"_eq":"terms-of-use"}}` or `{"slug":{"_eq":"privacy-policy"}}`.
        Include deep translations with `fields=*,translations.*`.
      operationId: cmsGetLegalPages
      parameters:
        - $ref: '#/components/parameters/DirectusFilter'
        - $ref: '#/components/parameters/DirectusFields'
        - $ref: '#/components/parameters/DirectusLimit'
      responses:
        '200':
          description: List of legal pages (typically one item matching the slug filter)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LegalPage'

  /items/contact_messages:
    post:
      tags:
        - CMS - Contact Messages
      summary: Submit a contact message
      description: |
        Creates a new contact message record. Triggers a Directus Flow that sends an
        email notification to the configured author email address.
      operationId: cmsCreateContactMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactMessageCreate'
            example:
              type: feedback
              title: "Great app!"
              message: "I love the event discovery feature."
              reply_email: "user@example.com"
              phone: "+420 123 456 789"
              device_info:
                app_version: "1.0.0+1"
                device_model: "iPhone 15 Pro"
                os_version: "iOS 17.4"
                firebase_uid: "abc123xyz"
      responses:
        '200':
          description: Created contact message record
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ContactMessage'
        '400':
          description: Validation error — missing required fields

  /directus-extension-firebase-auth/link:
    post:
      tags:
        - CMS - Firebase Auth
      summary: Link a Firebase account to a Directus user
      description: |
        Verifies a Firebase ID token and links it to a Directus user record, creating
        the user if one doesn't already exist for that email. The Firebase token's
        email must be verified. On repeat calls for an existing user, refreshes the
        stored `external_identifier` to the current Firebase UID and backfills the
        name from the token if the Directus name is still empty.

        Call this once after Firebase sign-up/sign-in, before calling `/auth`.
      operationId: firebaseLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id_token
              properties:
                id_token:
                  type: string
                  description: Firebase ID token from the client SDK
      responses:
        '200':
          description: User linked (existing or newly created)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                        format: email
                      role:
                        type: string
                        format: uuid
        '400':
          description: Missing id_token, or Firebase token has no email
        '401':
          description: Invalid Firebase token
        '403':
          description: Firebase email is not verified
        '500':
          description: Firebase not configured, or configured default role not found

  /directus-extension-firebase-auth/auth:
    post:
      tags:
        - CMS - Firebase Auth
      summary: Exchange a Firebase ID token for a Directus session
      description: |
        Verifies a Firebase ID token and issues a Directus-compatible access/refresh
        token pair for the linked user. The user must already exist — call `/link`
        first. The refresh token is stored as a Directus session record.
      operationId: firebaseAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id_token
              properties:
                id_token:
                  type: string
                  description: Firebase ID token from the client SDK
      responses:
        '200':
          description: Access and refresh tokens issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                      refresh_token:
                        type: string
                      expires:
                        type: integer
                        description: Access token lifetime in milliseconds
        '400':
          description: Missing id_token
        '401':
          description: Invalid Firebase token
        '403':
          description: Firebase email is not verified
        '404':
          description: No Directus user linked to this Firebase account — call /link first
        '500':
          description: Firebase not configured

components:
  parameters:
    DirectusId:
      name: id
      in: path
      required: true
      schema:
        oneOf:
          - type: integer
          - type: string
      example: 42

    DirectusFilter:
      name: filter
      in: query
      required: false
      description: JSON-encoded Directus filter object
      schema:
        type: string
      example: '{"status":{"_eq":"published"}}'

    DirectusFields:
      name: fields
      in: query
      required: false
      description: Comma-separated list of fields to include (supports dot notation for relations)
      schema:
        type: string
      example: "*,translations.*,venue.*"

    DirectusLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 100
      example: 50

    DirectusOffset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0

    DirectusSort:
      name: sort
      in: query
      required: false
      description: Comma-separated sort fields (prefix with `-` for descending)
      schema:
        type: string
      example: "-start_time"

  schemas:
    # ---- Workflow request/response schemas ----

    ProcessEventRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: Facebook event URL to process
          example: "https://www.facebook.com/events/1234567890"

    ProcessGroupRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: Facebook page or group URL to scrape events from
          example: "https://www.facebook.com/PragueSalsaClub/events"

    ReprocessEventRequest:
      type: object
      properties:
        id:
          oneOf:
            - type: integer
            - type: string
          description: Directus event ID. Either `id` or `translationId` is required.
          example: 42
        translationId:
          oneOf:
            - type: integer
            - type: string
          description: Directus translation record ID. Alternative to `id` — parent event and language are resolved automatically.
          example: 15
        steps:
          type: array
          description: Steps to re-run. If omitted, all steps are executed.
          items:
            type: string
            enum: [parts, info, translations, dances]
          example: ["translations"]
        lang:
          type: string
          description: Language code — when provided, only that language is (re-)translated.
          enum: [cs, en, es]
          example: "en"

    RetranslateItemRequest:
      type: object
      required:
        - itemId
        - itemType
        - sourceLang
        - modifiedTextFields
      properties:
        itemId:
          type: integer
          description: Directus ID of the event or course to retranslate
          example: 42
        itemType:
          type: string
          enum: [event, course]
          description: Whether the item is an event or a course
          example: "event"
        sourceLang:
          type: string
          enum: [cs, en, es]
          description: Language code of the edited translation (source for retranslation)
          example: "cs"
        modifiedTextFields:
          type: object
          additionalProperties:
            type: string
          description: Map of modified text field names to their new values (only translatable fields)
          example:
            title: "Nový název"
            description: "Nový popis"

    BatchAcknowledgement:
      type: object
      required:
        - acknowledged
        - message
      properties:
        acknowledged:
          type: boolean
          example: true
        message:
          type: string
          example: "Batch processing started"

    AlreadyProcessingResponse:
      type: object
      description: Returned when a workflow was already invoked for this URL but the event is not yet in Directus
      required:
        - status
        - url
      properties:
        status:
          type: string
          enum: [already_processing]
          example: "already_processing"
        url:
          type: string
          example: "https://www.facebook.com/events/1234567890"

    WorkflowErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: "Missing required field: 'url'"
        code:
          type: integer
          example: 400

    # ---- Shared Directus data schemas ----

    DirectusEvent:
      type: object
      properties:
        id:
          oneOf:
            - type: integer
            - type: string
          example: 42
        title:
          type: string
          description: Event title (Czech, from LLM extraction)
          example: "Pražská Salsa Noc"
        original_description:
          type: string
          description: Original Facebook event description (omitted by default in workflow list endpoint)
        organizer:
          type: string
          example: "Prague Salsa Club"
        venue:
          oneOf:
            - type: integer
            - type: string
            - $ref: '#/components/schemas/DirectusVenue'
            - type: 'null'
          description: Venue ID or expanded venue object
        start_time:
          type: string
          format: date-time
          nullable: true
          example: "2024-02-15T20:00:00.000Z"
        end_time:
          type: string
          format: date-time
          nullable: true
          example: "2024-02-16T02:00:00.000Z"
        timezone:
          type: string
          example: "Europe/Prague"
        original_url:
          type: string
          example: "https://www.facebook.com/events/1234567890"
        parts:
          type: array
          items:
            $ref: '#/components/schemas/EventPart'
        info:
          type: array
          items:
            $ref: '#/components/schemas/EventInfo'
        dances:
          type: array
          items:
            type: string
          example: ["Salsa", "Bachata"]
        status:
          type: string
          enum: [published, draft, archived]
          example: "published"
        image:
          oneOf:
            - type: integer
            - type: string
            - type: 'null'
          description: Directus file ID of the event cover image (stored in Directus Files / S3)
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        image_source:
          type: string
          enum: [facebook, ai_generated]
          nullable: true
          description: Origin of the cover image — "facebook" (downloaded from Facebook) or "ai_generated"
          example: "facebook"
        event_type:
          type: string
          enum: [party, workshop, festival, holiday, other]
          nullable: true
          description: Classified event type
          example: "party"
        translation_status:
          type: string
          enum: [complete, partial, missing]
          example: "complete"
        translations:
          type: array
          items:
            $ref: '#/components/schemas/DirectusEventTranslation'

    EventPart:
      type: object
      required:
        - name
        - description
        - type
        - dances
        - date_time_range
        - lectors
        - djs
      properties:
        name:
          type: string
          example: "Social Dancing"
        description:
          type: string
        type:
          type: string
          enum: [party, workshop, openLesson]
          example: "party"
        dances:
          type: array
          items:
            type: string
          example: ["Salsa"]
        date_time_range:
          type: object
          required: [start, end]
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
        lectors:
          type: array
          items:
            type: string
        djs:
          type: array
          items:
            type: string
          example: ["DJ Carlos"]

    EventInfo:
      type: object
      required:
        - type
        - key
        - value
      properties:
        type:
          type: string
          enum: [url, price, dresscode]
          example: "price"
        key:
          type: string
          example: "Entry Fee"
        value:
          type: string
          example: "200 Kč"

    DirectusEventTranslation:
      type: object
      required:
        - languages_code
        - title
        - description
        - parts_translations
        - info_translations
      properties:
        id:
          type: integer
        events_id:
          oneOf:
            - type: integer
            - type: string
        languages_code:
          type: string
          example: "cs"
        title:
          type: string
          example: "Pražská Salsa Noc"
        description:
          type: string
        parts_translations:
          type: array
          items:
            type: object
            required: [name, description]
            properties:
              name:
                type: string
              description:
                type: string
        info_translations:
          type: array
          items:
            type: object
            required: [key]
            properties:
              key:
                type: string

    DirectusVenue:
      type: object
      properties:
        id:
          oneOf:
            - type: integer
            - type: string
        name:
          type: string
          example: "Lucerna Music Bar"
        street:
          type: string
          example: "Vodičkova"
        number:
          type: string
          example: "36"
        town:
          type: string
          example: "Prague"
        country:
          type: string
          example: "CZ"
        postal_code:
          type: string
          example: "110 00"
        region:
          type: string
          example: "Hlavní město Praha"
        latitude:
          type: number
          nullable: true
          example: 50.0813
        longitude:
          type: number
          nullable: true
          example: 14.4258

    DirectusGroup:
      type: object
      properties:
        id:
          oneOf:
            - type: integer
            - type: string
        url:
          type: string
          description: Facebook page/group URL used as event source
          example: "https://www.facebook.com/PragueSalsaClub/events"
        type:
          type: string
          nullable: true
          example: "page"
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of last batch processing run for this group

    DirectusListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object

    DirectusSingleResponse:
      type: object
      properties:
        data:
          type: object

    DirectusCourse:
      type: object
      properties:
        id:
          oneOf:
            - type: integer
            - type: string
          example: 1
        title:
          type: string
          example: "Salsa On1 — Beginner Course"
        description:
          type: string
        instructor_name:
          type: string
          nullable: true
          example: "Maria García"
        instructor_bio:
          type: string
          nullable: true
        instructor_avatar_url:
          type: string
          nullable: true
        venue:
          oneOf:
            - type: integer
            - type: string
            - $ref: '#/components/schemas/DirectusVenue'
            - type: 'null'
          description: Venue ID or expanded venue object
        start_date:
          type: string
          format: date
          nullable: true
          example: "2024-03-05"
        end_date:
          type: string
          format: date
          nullable: true
          example: "2024-05-28"
        schedule_day:
          type: string
          nullable: true
          example: "Tuesday"
        schedule_time:
          type: string
          nullable: true
          example: "19:00 - 20:30"
        lesson_count:
          type: integer
          nullable: true
          example: 12
        lesson_duration_minutes:
          type: integer
          nullable: true
          example: 90
        max_participants:
          type: integer
          nullable: true
          example: 20
        current_participants:
          type: integer
          default: 0
          example: 8
        price:
          type: string
          nullable: true
          example: "3 600 Kč"
        price_note:
          type: string
          nullable: true
          example: "Includes all 12 lessons"
        level:
          type: string
          enum: [beginner, intermediate, advanced, all_levels]
          nullable: true
          example: "beginner"
        dances:
          type: array
          items:
            type: string
          example: ["salsa-on1", "salsa"]
        image:
          oneOf:
            - type: integer
            - type: string
            - type: 'null'
          description: Directus file ID of the course cover image
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        image_source:
          type: string
          enum: [facebook, ai_generated]
          nullable: true
          description: Origin of the cover image
          example: "facebook"
        original_url:
          type: string
          nullable: true
          example: "https://www.facebook.com/events/1234567890"
        original_description:
          type: string
          nullable: true
        status:
          type: string
          enum: [published, draft, archived]
          example: "published"
        translation_status:
          type: string
          enum: [complete, partial, missing]
          nullable: true
          example: "complete"
        translations:
          type: array
          items:
            $ref: '#/components/schemas/DirectusCourseTranslation'

    DirectusCourseTranslation:
      type: object
      properties:
        id:
          type: integer
        courses_id:
          oneOf:
            - type: integer
            - type: string
        languages_code:
          type: string
          example: "en"
        title:
          type: string
          example: "Salsa On1 — Beginner Course"
        description:
          type: string
        learning_items:
          type: array
          items:
            type: string
          example: ["Basic salsa footwork", "Partner leading and following", "Turns and spins"]

    DirectusDanceStyle:
      type: object
      properties:
        code:
          type: string
          description: Unique identifier and primary key (e.g. "salsa", "bachata-sensual")
          example: "salsa"
        name:
          type: string
          description: English display name
          example: "Salsa"
        parent_code:
          type: string
          nullable: true
          description: Code of the parent dance style (null for top-level styles)
          example: null
        sort_order:
          type: integer
          description: Display ordering
          example: 1
        translations:
          type: array
          items:
            $ref: '#/components/schemas/DirectusDanceStyleTranslation'

    DirectusDanceStyleTranslation:
      type: object
      properties:
        id:
          type: integer
        dance_styles_code:
          type: string
          description: Code of the parent dance style
          example: "salsa"
        languages_code:
          type: string
          example: "cs"
        name:
          type: string
          example: "Salsa"

    DirectusFavorite:
      type: object
      required:
        - user_id
        - item_type
        - item_id
      properties:
        id:
          oneOf:
            - type: integer
            - type: string
          example: 1
        user_id:
          type: string
          description: User identifier (indexed)
          example: "user-123"
        item_type:
          type: string
          enum: [event, course]
          description: Type of the saved item
          example: "event"
        item_id:
          type: integer
          description: ID of the saved event or course
          example: 42
        created_at:
          type: string
          format: date-time
          description: Timestamp when the favorite was created (auto-set)
          example: "2024-02-15T20:00:00.000Z"

    DirectusError:
      type: object
      properties:
        id:
          oneOf:
            - type: integer
            - type: string
        url:
          type: string
          example: "https://www.facebook.com/events/1234567890"
        message:
          type: string
          example: "Failed to scrape event"
        type:
          type: string
          enum: [scrape_failed, parse_failed, llm_parse_failed, workflow_failed, schedule_failed, unknown]
          example: "scrape_failed"
        datetime:
          type: string
          format: date-time

    DirectusSkippedEvent:
      type: object
      properties:
        id:
          oneOf:
            - type: integer
            - type: string
        original_url:
          type: string
          example: "https://www.facebook.com/events/1234567890"
        reason:
          type: string
          nullable: true
          example: "unsupported_type"
        event_type:
          type: string
          nullable: true
          example: "holiday"
        datetime:
          type: string
          format: date-time

    DirectusUserProfile:
      type: object
      description: Directus user record with custom profile fields
      properties:
        id:
          type: string
          format: uuid
          description: Directus user UUID (primary key)
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        firebase_uid:
          type: string
          description: Firebase Auth UID used to look up this record
          example: "abc123xyz"
        first_name:
          type: string
          nullable: true
          example: "Jana"
        last_name:
          type: string
          nullable: true
          example: "Nováková"
        email:
          type: string
          format: email
          example: "jana@example.com"
        phone:
          type: string
          nullable: true
          example: "+420 123 456 789"
        city:
          type: string
          nullable: true
          example: "Prague"
        bio:
          type: string
          nullable: true
          example: "Passionate salsa dancer since 2018."
        avatar:
          oneOf:
            - type: string
              format: uuid
            - type: object
              properties:
                id:
                  type: string
                  format: uuid
            - type: 'null'
          description: Directus file UUID of the avatar image, or expanded file object
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        dance_tags:
          type: array
          items:
            type: string
          description: Dance style tags selected by the user
          example: ["salsa", "bachata"]
        experience_level:
          type: string
          nullable: true
          example: "intermediate"

    DirectusUserProfileUpdate:
      type: object
      description: Fields that can be updated on a Directus user profile via PATCH
      properties:
        first_name:
          type: string
          example: "Jana"
        last_name:
          type: string
          example: "Nováková"
        phone:
          type: string
          nullable: true
          example: "+420 123 456 789"
        city:
          type: string
          nullable: true
          example: "Prague"
        bio:
          type: string
          nullable: true
          example: "Passionate salsa dancer since 2018."
        dance_tags:
          type: array
          items:
            type: string
          example: ["salsa", "bachata"]
        experience_level:
          type: string
          nullable: true
          example: "intermediate"

    LegalPage:
      type: object
      description: A legal content page (Terms of Use or Privacy Policy) with translations
      properties:
        id:
          oneOf:
            - type: integer
            - type: string
          example: 1
        slug:
          type: string
          description: Unique identifier for the page content
          enum: [terms-of-use, privacy-policy]
          example: "terms-of-use"
        status:
          type: string
          enum: [published, draft]
          example: "published"
        translations:
          type: array
          items:
            $ref: '#/components/schemas/LegalPageTranslation'

    LegalPageTranslation:
      type: object
      description: Translated content for a legal page in a specific language
      required:
        - languages_code
        - title
        - content
      properties:
        id:
          type: integer
          example: 1
        legal_pages_id:
          oneOf:
            - type: integer
            - type: string
          description: FK to the parent legal_pages record
          example: 1
        languages_code:
          type: string
          description: BCP 47 language code
          example: "en"
        title:
          type: string
          example: "Terms of Use"
        content:
          type: string
          description: Full Markdown content of the legal page
          example: "# Terms of Use\n\nWelcome to Dancee..."

    ContactMessage:
      type: object
      description: A contact/feedback message submitted by a user
      properties:
        id:
          oneOf:
            - type: integer
            - type: string
          example: 1
        type:
          type: string
          enum: [bug, feature, feedback, other]
          example: "feedback"
        title:
          type: string
          example: "Great app!"
        message:
          type: string
          example: "I love the event discovery feature."
        reply_email:
          type: string
          format: email
          example: "user@example.com"
        phone:
          type: string
          nullable: true
          example: "+420 123 456 789"
        device_info:
          $ref: '#/components/schemas/ContactMessageDeviceInfo'
        date_created:
          type: string
          format: date-time
          description: Auto-set creation timestamp
          example: "2024-02-15T20:00:00.000Z"

    ContactMessageCreate:
      type: object
      description: Payload for creating a new contact message
      required:
        - type
        - title
        - message
        - reply_email
        - device_info
      properties:
        type:
          type: string
          enum: [bug, feature, feedback, other]
          example: "feedback"
        title:
          type: string
          example: "Great app!"
        message:
          type: string
          example: "I love the event discovery feature."
        reply_email:
          type: string
          format: email
          example: "user@example.com"
        phone:
          type: string
          nullable: true
          example: "+420 123 456 789"
        device_info:
          $ref: '#/components/schemas/ContactMessageDeviceInfo'

    ContactMessageDeviceInfo:
      type: object
      description: Device and app context captured at submission time
      required:
        - app_version
        - device_model
        - os_version
        - firebase_uid
      properties:
        app_version:
          type: string
          description: App version and build number
          example: "1.0.0+1"
        device_model:
          type: string
          description: Device model name
          example: "iPhone 15 Pro"
        os_version:
          type: string
          description: Operating system version
          example: "iOS 17.4"
        firebase_uid:
          type: string
          description: Firebase Auth UID of the submitting user
          example: "abc123xyz"
