app = 'dancee-app'
primary_region = 'fra'

[build]
  dockerfile = "Dockerfile"

[build.args]
  # Non-sensitive build args can go here.
  # Sensitive values (DIRECTUS_BASE_URL, DIRECTUS_ACCESS_TOKEN) are passed
  # via --build-arg during deploy or set as build secrets.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
